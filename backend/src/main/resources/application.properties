# ======================================================
# Ai Powered Campus Connect Platform - Backend Config
# ======================================================

# Application Specification
spring.application.name=campus-connect-backend
server.port=8080

# Environment Variable Placeholders for Database Connection
# DO NOT hardcode real production credentials here.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campus_connect_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Properties
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Allows Spring Boot to run health checks without failing if database is offline in Phase 3
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Centralized CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000
