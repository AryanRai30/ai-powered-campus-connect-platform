# ======================================================
# Ai Powered Campus Connect Platform - Backend Config
# ======================================================

# Application Specification
spring.application.name=campus-connect-backend
server.port=8080

# Environment Variable Placeholders for Database Connection
# DO NOT hardcode real production credentials here.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campus_connect_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Centralized CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000

# JWT Authentication Properties
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

